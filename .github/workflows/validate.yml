name: validate

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # This repository ships standard-library-only Python that runs on a
        # stranger's machine with no install step. The floor proves the scripts
        # do not quietly depend on newer syntax; the ceiling catches deprecations.
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: PlantUML, so Diagram as Code rendering is exercised
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq plantuml
          plantuml -version

      - name: Sphinx and MyST, so the build harness is actually exercised
        run: |
          # Without these, render_docs.py --check falls through to docutils or reports
          # `skipped`, and every acceptance case for the harness is a case nothing runs.
          # Installing Sphinx locally for the first time found three defects in merged
          # code within minutes, which is the argument for having it here.
          #
          # These are test-time dependencies only. The scripts stay standard-library
          # only. CI installs them so the shipped Sphinx integration is exercised.
          python3 -m pip install --quiet --disable-pip-version-check sphinx myst-parser sphinxcontrib-plantuml
          sphinx-build --version

      - name: Every script compiles
        run: python3 -m compileall -q tools shared plugins

      - name: Structural validation
        run: python3 tools/validate.py

      - name: No drift between shared/ and its materialized copies
        run: python3 tools/materialize.py --check

      - name: Detection script runs and is scoped
        run: |
          # Bare invocation against a fixture must succeed; confidence must not
          # be "none" for a scenario that plainly declares pytest.
          python3 shared/scripts/detect_stack.py fixtures/02-wrong-test

      - name: Every behavioural test
        run: |
          # Globbed rather than listed, so a new tools/test_*.py is covered the moment
          # it lands instead of the day someone remembers to edit this file. Each one is
          # stdlib-only and exits non-zero on failure.
          status=0
          for test in tools/test_*.py; do
            echo "== $test"
            python3 "$test" || status=1
          done
          exit $status
